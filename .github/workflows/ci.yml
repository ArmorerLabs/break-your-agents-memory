name: lab

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lab:
    runs-on: warp-custom-gcp-use4-u2404-x64-2x
    steps:
      # SHA-pinned: this repo's Actions policy requires full-SHA references
      # (tag refs like @v4 fail the whole workflow at startup).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit and golden tests (offline, fixtures mode)
        run: pytest
        env:
          MEM0_TELEMETRY: "False"
      - name: The lab runs end to end (offline)
        run: |
          python -m lab.run --settings all --no-record --run-id ci-chain
          python -m lab.run --topology team --settings all --no-record --run-id ci-team
          python -m lab.run --mode replay --settings all --run-id ci-replay
